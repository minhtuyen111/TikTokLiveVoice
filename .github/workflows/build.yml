name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      BRIDGE_URL: ${{ vars.BRIDGE_URL }}
      APK_SIG_SHA256: ${{ vars.APK_SIG_SHA256 }}
      # versionCode tăng theo mỗi lần build để cài đè được bản cũ (= số lần chạy workflow)
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Offline Vietnamese neural voice + Sherpa ONNX Android runtime.
      # Voice model is vais1000-medium (22.05 kHz); keep attribution in THIRD_PARTY_NOTICES.md.
      - name: Prepare offline Vietnamese TTS assets
        run: |
          mkdir -p app/libs app/src/main/assets/tts_vi "$RUNNER_TEMP/tts_vi"
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar \
            -o app/libs/sherpa-onnx-1.13.8.aar
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-vi_VN-vais1000-medium.tar.bz2 \
            -o "$RUNNER_TEMP/vais1000.tar.bz2"
          tar -xjf "$RUNNER_TEMP/vais1000.tar.bz2" -C "$RUNNER_TEMP/tts_vi"
          MODEL="$(find "$RUNNER_TEMP/tts_vi" -name 'vi_VN-vais1000-medium.onnx' -type f | head -n 1)"
          test -n "$MODEL"
          MODEL_DIR="$(dirname "$MODEL")"
          cp "$MODEL" app/src/main/assets/tts_vi/
          cp "$MODEL_DIR/tokens.txt" app/src/main/assets/tts_vi/
          # espeak-ng-data BẮT BUỘC: thiếu thì giọng native sập cả app, nên fail build thay vì phát hành APK lỗi.
          test -d "$MODEL_DIR/espeak-ng-data" || { echo "::error::thiếu espeak-ng-data trong gói giọng"; exit 1; }
          cp -a "$MODEL_DIR/espeak-ng-data" app/src/main/assets/tts_vi/
          test -s app/src/main/assets/tts_vi/tokens.txt
          test "$(stat -c %s app/src/main/assets/tts_vi/vi_VN-vais1000-medium.onnx)" -gt 1000000
          ls -lh app/libs/sherpa-onnx-1.13.8.aar app/src/main/assets/tts_vi/

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      # Khóa ký: dùng secret KEYSTORE_B64 (khuyến nghị, để cập nhật đè lên bản cũ được).
      # Không có secret thì tự sinh khóa tạm: APK vẫn cài được nhưng mỗi lần build là một chữ ký mới.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD_S: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_S: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_S" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS_S" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEYSTORE_PASSWORD_S" >> "$GITHUB_ENV"
          else
            PW="$(openssl rand -hex 12)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW" -keypass "$PW" \
              -alias voicelive -keyalg RSA -keysize 2048 -validity 9125 -dname "CN=Voice Live TikTok"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=voicelive" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Bản release (R8 thu nhỏ + làm rối) chạy mượt hơn hẳn bản debug.
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: voicelive-apk
          path: app/build/outputs/apk/release/voicelive-release.apk
          retention-days: 14
