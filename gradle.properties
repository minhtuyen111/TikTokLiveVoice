org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Cấu hình công khai (anon key của Supabase là khóa công khai theo thiết kế).
# KHÔNG đặt service_role key ở đây. Có thể ghi đè bằng biến môi trường
# SUPABASE_URL / SUPABASE_ANON_KEY (GitHub Secrets/Variables) khi build.
SUPABASE_URL=https://YOUR-PROJECT.supabase.co
SUPABASE_ANON_KEY=YOUR_ANON_KEY

# Tùy chọn (để trống nếu không dùng):
# BRIDGE_URL: địa chỉ wss:// dự phòng nếu chưa đặt trong trang Quản trị.
# APK_SIG_SHA256: vân tay SHA-256 chứng chỉ ký bản phát hành để chống đóng gói lại.
BRIDGE_URL=
APK_SIG_SHA256=
